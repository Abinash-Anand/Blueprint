# Engineering City — local-first deployment.
#   docker compose up --build      → http://localhost
# Only the frontend is published, and only on 127.0.0.1 (not reachable from your network).
name: engineering-city

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-engineering_city}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engineering_city_local}
      POSTGRES_DB: ${POSTGRES_DB:-engineering_city}
      TZ: Europe/Berlin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No published ports: the database is reachable only inside the compose network.

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-engineering_city}:${POSTGRES_PASSWORD:-engineering_city_local}@db:5432/${POSTGRES_DB:-engineering_city}?schema=public
      PORT: "3000"
      TZ: Europe/Berlin
      # Optional: pin "today" for demos/tests (YYYY-MM-DD). Leave empty in normal use.
      APP_TODAY: ${APP_TODAY:-}
      # AI check and voice (docs/AI-Voice-Design.md §10). Off unless AI_ENABLED=true; keys stay in .env, never in the image.
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_EVALUATION_PROVIDER: ${AI_EVALUATION_PROVIDER:-gemini}
      AI_TRANSCRIPTION_PROVIDER: ${AI_TRANSCRIPTION_PROVIDER:-}
      AI_EVALUATION_MODEL: ${AI_EVALUATION_MODEL:-}
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_LANGUAGE: ${AI_LANGUAGE:-en}
      AI_MAX_RECORDING_SECONDS: ${AI_MAX_RECORDING_SECONDS:-120}
      AI_MAX_FOLLOW_UPS: ${AI_MAX_FOLLOW_UPS:-1}
      AI_MAX_EVALUATIONS_PER_HOUR: ${AI_MAX_EVALUATIONS_PER_HOUR:-30}
      AI_MAX_TRANSCRIPTIONS_PER_HOUR: ${AI_MAX_TRANSCRIPTIONS_PER_HOUR:-30}
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-0}
      AI_MONTHLY_BUDGET_EUR: ${AI_MONTHLY_BUDGET_EUR:-5}
      AI_PRICE_INPUT_PER_MTOK_EUR: ${AI_PRICE_INPUT_PER_MTOK_EUR:-0}
      AI_PRICE_OUTPUT_PER_MTOK_EUR: ${AI_PRICE_OUTPUT_PER_MTOK_EUR:-0}
      AI_PRICE_AUDIO_PER_MIN_EUR: ${AI_PRICE_AUDIO_PER_MIN_EUR:-0}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-60000}
      AI_FAKE_TRANSCRIPT: ${AI_FAKE_TRANSCRIPT:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
