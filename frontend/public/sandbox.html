<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Code sandbox</title>
</head>
<body>
<script>
/*
 * Blueprint's code sandbox (Revision v2, phase 4). Loaded in <iframe sandbox="allow-scripts">: an opaque origin with no
 * cookies, storage or access to the app. Its own Content-Security-Policy (nginx.conf) allows no network at all and only
 * this script (by hash) and blob: workers. Each run is a fresh Web Worker, ended after the time limit, so a loop that
 * never stops cannot freeze the page. Only text goes back to the app: what the code printed, and its error.
 * Changing this script changes its hash: update nginx.conf (a frontend test checks they match).
 */
(() => {
  const LIMIT_MS = 5000, MAX_LINES = 200, MAX_CHARS = 20000;
  const RUNNER = String.raw`
    const __sbPost = (m) => postMessage(m);
    const __sbShow = (v, seen = new WeakSet(), depth = 0) => {
      if (typeof v === "string") return depth ? JSON.stringify(v) : v;
      if (v === undefined) return "undefined";
      if (typeof v === "function") return "[Function " + (v.name || "anonymous") + "]";
      if (typeof v === "bigint") return v + "n";
      if (typeof v === "symbol") return v.toString();
      if (v === null || typeof v !== "object") return String(v);
      if (v instanceof Error) return v.name + ": " + v.message;
      if (seen.has(v)) return "[Circular]";
      if (depth > 3) return Array.isArray(v) ? "[Array]" : "[Object]";
      seen.add(v);
      if (Array.isArray(v)) return "[ " + v.map((x) => __sbShow(x, seen, depth + 1)).join(", ") + " ]";
      if (v instanceof Map) return "Map(" + v.size + ") { " + [...v].map(([k, x]) => __sbShow(k, seen, depth + 1) + " => " + __sbShow(x, seen, depth + 1)).join(", ") + " }";
      if (v instanceof Set) return "Set(" + v.size + ") { " + [...v].map((x) => __sbShow(x, seen, depth + 1)).join(", ") + " }";
      if (v instanceof Date) return v.toISOString();
      if (typeof v.then === "function") return "Promise { … }";
      const name = v.constructor && v.constructor !== Object ? v.constructor.name + " " : "";
      return name + "{ " + Object.keys(v).map((k) => k + ": " + __sbShow(v[k], seen, depth + 1)).join(", ") + " }";
    };
    const __sbSay = (kind) => (...args) => __sbPost({ type: "line", kind, text: args.map((a) => __sbShow(a)).join(" ") });
    const __sbReport = (e) => __sbPost({ type: "error", text: e && e.name ? e.name + ": " + e.message : String(e) });
    self.console = { log: __sbSay("log"), info: __sbSay("info"), warn: __sbSay("warn"), error: __sbSay("error"), debug: __sbSay("log"), table: __sbSay("log") };
    self.onerror = (msg, _src, line) => { __sbPost({ type: "error", text: String(msg) + (line ? " (line " + line + ")" : "") }); return true; };
    self.onunhandledrejection = (e) => __sbReport(e.reason);
    // Count timers, so the run ends as soon as nothing is left to happen.
    const __sbLive = new Set();
    const __sbST = setTimeout, __sbCT = clearTimeout, __sbSI = setInterval, __sbCI = clearInterval;
    const __sbCheck = () => __sbST(() => __sbLive.size === 0 && __sbPost({ type: "done" }), 0);
    self.setTimeout = (f, ms, ...a) => { const id = __sbST(() => { __sbLive.delete(id); try { if (typeof f === "function") f(...a); } catch (e) { __sbReport(e); } __sbCheck(); }, ms); __sbLive.add(id); return id; };
    self.clearTimeout = (id) => { __sbLive.delete(id); __sbCT(id); __sbCheck(); };
    self.setInterval = (f, ms, ...a) => { const id = __sbSI(() => { try { if (typeof f === "function") f(...a); } catch (e) { __sbReport(e); } }, ms); __sbLive.add(id); return id; };
    self.clearInterval = (id) => { __sbLive.delete(id); __sbCI(id); __sbCheck(); };
    const require = (name) => { throw new Error('"' + name + '" can\'t be imported here: the sandbox runs plain JavaScript and TypeScript without libraries.'); };
    const exports = {}, module = { exports };
  `;
  let run = null;

  const finish = (extra) => {
    if (!run) return;
    clearTimeout(run.hard);
    run.worker.terminate();
    parent.postMessage({ type: "result", id: run.id, lines: run.lines, error: run.error, truncated: run.truncated, ms: Math.round(performance.now() - run.t0), ...extra }, "*");
    run = null;
  };

  addEventListener("message", (e) => {
    if (e.source !== parent) return;
    const m = e.data;
    if (!m || m.type !== "run" || typeof m.code !== "string" || typeof m.id !== "number") return;
    if (run) finish({ stopped: true });
    const source = RUNNER + "\ntry {\n" + m.code + "\n} catch (e) { __sbReport(e); }\n__sbCheck();\n";
    const url = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
    const worker = new Worker(url);
    URL.revokeObjectURL(url);
    const r = { id: m.id, worker, lines: [], chars: 0, error: null, truncated: false, t0: performance.now(), hard: 0 };
    r.hard = setTimeout(() => finish({ timedOut: true }), LIMIT_MS);
    run = r;
    worker.onmessage = (ev) => {
      if (run !== r) return;
      const d = ev.data || {};
      if (d.type === "line") {
        if (r.lines.length < MAX_LINES && r.chars < MAX_CHARS) {
          const text = String(d.text).slice(0, 2000);
          r.lines.push({ kind: d.kind, text });
          r.chars += text.length;
        } else r.truncated = true;
      } else if (d.type === "error") {
        r.error = r.error || String(d.text).slice(0, 2000);
      } else if (d.type === "done") finish({});
    };
    worker.onerror = (ev) => {
      ev.preventDefault();
      if (run !== r) return;
      r.error = r.error || String(ev.message || "The code could not run.").slice(0, 2000);
      finish({});
    };
  });

  parent.postMessage({ type: "ready" }, "*");
})();
</script>
</body>
</html>
