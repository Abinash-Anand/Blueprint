# Requests for any other host name (DNS rebinding, AI design §8.2) are dropped without an answer.
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  server_name localhost 127.0.0.1;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 128k;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Voice recordings (16 kHz mono WAV, at most ~4 MB) are the only large uploads; the provider call can take a while (backend timeout 60 s).
  location = /api/ai/transcriptions {
    client_max_body_size 5m;
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 75s;
  }

  # REST API (same origin, so no CORS is needed). $http_host keeps the port, so the backend's same-origin check
  # compares the browser's Origin with the address it actually used.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 75s;
  }

  # Hashed build assets can be cached for a long time
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Single-page app
  location / {
    try_files $uri /index.html;
  }
}
